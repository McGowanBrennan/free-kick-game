# Render blueprint: one web service that builds the game and runs the server
# (game files and friend matches on one port). New → Blueprint → this repo.
services:
  - type: web
    name: flick-arena
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm run server:build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
